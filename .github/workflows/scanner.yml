name: NSE Pro Scanner

on:
 # schedule:
  #  - cron: "50 3 * * 1-5"    # 09:20 AM IST (Mon-Fri)
  #  - cron: "30 9 * * 1-5"    # 03:00 PM IST (Mon-Fri)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: scan, test, telegram_test, fundamentals"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - telegram_test
          - test
          - fundamentals
          - setup_sheets
      symbol:
        description: "Stock symbol (for test mode only)"
        required: false
        default: "RELIANCE"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env file
        run: |
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "SHEETS_DOC_NAME=${{ secrets.SHEETS_DOC_NAME }}" >> .env
          echo "SHEETS_CRED_FILE=service_account.json" >> .env

      - name: Write Sheets credentials
        run: echo '${{ secrets.SHEETS_CRED_JSON }}' > service_account.json

      - name: Run Telegram connection test
        if: ${{ github.event.inputs.mode == 'telegram_test' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os, requests
          token   = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          msg = (
              "✅ NSE Pro Scanner is LIVE!\n\n"
              "Your Telegram alerts are working perfectly.\n"
              "Scanner runs automatically at:\n"
              "📅 9:20 AM IST — Morning scan\n"
              "📅 3:00 PM IST — Pre-close scan\n\n"
              "Every market day. No action needed! 🚀"
          )
          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": msg},
              timeout=10
          )
          print("Status:", r.status_code)
          if r.status_code == 200:
              print("✅ Telegram OK!")
          else:
              print("❌ Failed:", r.text)
              exit(1)
          PYEOF

      - name: Run scanner
        if: ${{ github.event.inputs.mode != 'telegram_test' }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SYMBOL="${{ github.event.inputs.symbol }}"
          if [ -z "$MODE" ]; then
            MODE="scan"
          fi
          if [ "$MODE" = "setup_sheets" ]; then
            python setup_sheets.py
          else
            python scanner.py $MODE $SYMBOL
          fi

      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-log-${{ github.run_id }}
          path: scanner.log
          retention-days: 14
