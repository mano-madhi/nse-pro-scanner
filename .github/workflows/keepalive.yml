name: Keep Alive

on:
  schedule:
    # Runs every Sunday at 8:00 AM IST (2:30 AM UTC)
    - cron: "30 2 * * 0"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep workflow active
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          workflow_files: "scanner.yml"
          commit_message: "chore: keep scanner workflow active"
